routes:
  # US - Amtrak
  - id: amtrak-nec-dc-boston
    operator: Amtrak
    route: Washington DC - Boston
    from: WAS
    to: BOS
    source:
      type: osm_relation
      relation_id: 9796352 # Acela (BOS -> WAS)

  - id: amtrak-empire-nyc-albany
    operator: Amtrak
    route: New York - Albany-Rensselaer
    from: NYP
    to: ALB
    source:
      type: osm_relation
      relation_id: 10322902 # Empire Service 230 (ALB -> NYP)

  - id: amtrak-boston-springfield
    operator: Amtrak
    route: Boston - Springfield
    from: BOS
    to: SPG
    source:
      type: osm_relation
      relation_id: 10946019 # Lake Shore Limited 449 (BOS -> CHI)
      clip_to_endpoints: true
      clip_padding: 0.02 # Tight pad so the clip stops cleanly at Springfield

  - id: amtrak-downeaster
    operator: Amtrak Downeaster
    route: Boston North - Brunswick
    from: BON
    to: BRK
    source:
      type: osm_relation
      relation_id: 10322756 # Downeaster route_master

  # US - LIRR (Commuter)
  - id: lirr-ronkonkoma
    operator: Long Island Rail Road
    route: New York Penn - Ronkonkoma
    tier: commuter
    from: NYP
    to: RON
    source:
      type: overpass_query
      # Penn->Ronkonkoma branch + Main Line east of Jamaica to fill the Third Track gap (avoids LIC stub)
      query: |
        [out:json][timeout:60];
        relation(8325874)->.branch;
        relation(3898476)->.mainline;
        (
          way(r.branch);
          way(r.mainline)(40.69,-73.82,40.82,-73.10);
        );
        out geom;
      clip_bbox: [-74.00, 40.69, -73.105, 40.83]

  - id: lirr-port-jefferson
    operator: Long Island Rail Road
    route: New York Penn - Port Jefferson
    tier: commuter
    from: NYP
    to: PJN
    source:
      type: osm_relation
      relation_id: 1255264 # Port Jefferson Branch

  - id: lirr-montauk-patchogue
    operator: Long Island Rail Road
    route: New York Penn - Patchogue
    tier: commuter
    from: NYP
    to: PGE
    source:
      type: osm_relation
      relation_ids: [4509484, 4501572] # Babylon (NYP-Babylon) + Montauk (Jamaica-Montauk)
      clip_bbox: [-74.00, 40.63, -73.015, 40.78]

  - id: lirr-long-beach-oceanside
    operator: Long Island Rail Road
    route: New York Penn - Oceanside
    tier: commuter
    from: NYP
    to: ODE
    source:
      type: osm_relation
      relation_id: 8712202 # Long Beach Branch (NYP -> Long Beach)
      clip_bbox: [-74.00, 40.6345, -73.64, 40.76]

  - id: lirr-atlantic
    operator: Long Island Rail Road
    route: Atlantic Terminal - Jamaica
    tier: commuter
    from: ATL
    to: JAM
    source:
      type: osm_relation
      relation_id: 21156462 # Far Rockaway Branch (Atlantic Terminal -> Jamaica -> Far Rockaway)
      clip_bbox: [-73.985, 40.665, -73.807, 40.710]

  # Europe - Scandinavia
  - id: oresundstag-cph-triangeln
    operator: Øresundståg
    route: Copenhagen Airport - Malmö Triangeln
    tier: intercity
    from: CPH
    to: TRI
    source:
      type: overpass_query
      # Match train relations crossing the Øresund Bridge, then split bbox to stop at Triangeln (excludes Malmö C)
      query: |
        [out:json][timeout:60];
        relation["route"="train"](55.56,12.75,55.61,12.90)->.bridge;
        (
          way(r.bridge)(55.55,12.648,55.635,12.95);
          way(r.bridge)(55.55,12.94,55.5945,13.01);
        );
        out geom;

  # US - NJ Transit (Commuter)
  - id: njt-njcl-woodbridge
    operator: NJ Transit
    route: New York Penn - Woodbridge
    tier: commuter
    from: NYP
    to: WDB
    source:
      type: osm_relation
      relation_id: 207401 # North Jersey Coast Line
      clip_bbox: [-74.30, 40.555, -73.98, 40.78]

  - id: njt-meadowlands
    operator: NJ Transit
    route: Secaucus Junction - Meadowlands
    tier: commuter
    from: SEC
    to: MDL
    source:
      type: overpass_query
      # Finds the Meadowlands shuttle relation by stadium terminus bbox (resilient to sponsorship renames)
      query: |
        [out:json][timeout:60];
        relation["route"="train"](40.805,-74.080,40.818,-74.065);
        way(r);
        out geom;
      clip_bbox: [-74.12, 40.758, -74.045, 40.85]

  # US - Metro-North (Commuter)
  - id: mnr-new-haven
    operator: Metro-North Railroad
    route: Grand Central - New Haven
    tier: commuter
    from: GCT
    to: NHV
    source:
      type: overpass_query
      # 11021730 starts at Woodlawn Junction (Bronx border);
      # stitch in New Haven passenger train ways through Manhattan and the Bronx into Grand Central
      query: |
        [out:json][timeout:60];
        relation(11021730);
        (._; rel(r);)->.nh_infra;
        relation["route"="train"]["name"~"New Haven",i](40.75,-73.985,40.81,-73.93)->.nh_gct;
        (
          way(r.nh_infra);
          way(r.nh_gct)(40.748,-73.99,40.92,-73.80);
        );
        out geom;
      clip_bbox: [-74.00, 40.74, -72.925, 41.305]

  # US - CTrail (Commuter)
  - id: ctrail-hartford-line
    operator: CTrail
    route: New Haven - Windsor Locks
    tier: commuter
    from: NHV
    to: WNL
