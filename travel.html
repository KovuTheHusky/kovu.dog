layout: default
title: Travel
permalink: /travel
---

<style>
  ::-webkit-scrollbar {
    width: 0 !important;
  }

  .mapboxgl-popup-content img.emoji {
    height: 1em !important;
    position: relative !important;
    top: -2px !important;
    vertical-align: bottom !important;
  }
</style>
<link href="/node_modules/mapbox-gl/dist/mapbox-gl.css" rel="stylesheet" />
<script
  src="/node_modules/mapbox-gl/dist/mapbox-gl.js"
  data-cfasync="false"
></script>
<div
  id="map"
  style="position: absolute; top: 0; left: 0; width: 100%; height: 100%"
></div>
<div
  class="position-absolute bottom-0 start-50 translate-middle-x mb-3 z-3 d-flex gap-3"
>
  <!-- Projection Toggle -->
  <div class="btn-group shadow" role="group" aria-label="Projection toggle">
    <input
      type="checkbox"
      class="btn-check"
      id="toggle-projection"
      checked
      autocomplete="off"
    />
    <label class="btn btn-dark" for="toggle-projection"
      ><i class="fa-solid fa-globe"></i
    ></label>
  </div>

  <!-- Layer Toggles -->
  <div class="btn-group shadow" role="group" aria-label="Layer toggles">
    <input
      type="checkbox"
      class="btn-check"
      id="toggle-places"
      checked
      autocomplete="off"
    />
    <label class="btn btn-dark" for="toggle-places"
      ><i class="fa-solid fa-location-dot"></i
    ></label>

    <input
      type="checkbox"
      class="btn-check"
      id="toggle-flights"
      checked
      autocomplete="off"
    />
    <label class="btn btn-dark" for="toggle-flights"
      ><i class="fa-solid fa-plane"></i
    ></label>

    <input
      type="checkbox"
      class="btn-check"
      id="toggle-cruises"
      checked
      autocomplete="off"
    />
    <label class="btn btn-dark" for="toggle-cruises"
      ><i class="fa-solid fa-ship"></i
    ></label>

    <input
      type="checkbox"
      class="btn-check"
      id="toggle-trains"
      checked
      autocomplete="off"
    />
    <label class="btn btn-dark" for="toggle-trains"
      ><i class="fa-solid fa-train"></i
    ></label>
  </div>
</div>
<script data-cfasync="false">
  mapboxgl.accessToken =
    "pk.eyJ1Ijoia292dXRoZWh1c2t5IiwiYSI6ImNqOG5mN3djYjE5czkycXJ0dzRnd3ZxMWoifQ.GzioSYbbeQRtheWUd-BVAw";

  const map = new mapboxgl.Map({
    attributionControl: false,
    center: [-74.0059662, 40.7127848],
    container: "map",
    hash: true,
    projection: "globe",
    style: {
      version: 8,
      sources: {
        "mapbox-dark-tiles": {
          type: "raster",
          tiles: [
            `https://api.mapbox.com/styles/v1/mapbox/dark-v11/tiles/{z}/{x}/{y}?access_token=${mapboxgl.accessToken}`,
          ],
          tileSize: 256,
        },
      },
      sprite: "https://{{ site.hostname }}/sprite",
      glyphs: "mapbox://fonts/mapbox/{fontstack}/{range}.pbf",
      layers: [
        {
          id: "mapbox-dark-layer",
          type: "raster",
          source: "mapbox-dark-tiles",
        },
      ],
    },
    zoom: 2,
  });

  map.dragRotate.disable();
  map.touchZoomRotate.disableRotation();
  map.addControl(
    new mapboxgl.AttributionControl({ compact: true }),
    "bottom-right",
  );

  // --- Shared Constants & Helpers ---
  const todayISO = new Date().toLocaleDateString("en-CA"); // Local YYYY-MM-DD
  const STATUS_COLOR = [
    "match",
    ["get", "status"],
    "future",
    "#ffd700",
    "#c0c0c0",
  ];
  const WATER_LINE_LAYOUT = { "line-join": "round", "line-cap": "round" };

  function getFlagUrl(flagId) {
    if (!flagId) return "";
    if (flagId === "us-dc") {
      return "https://upload.wikimedia.org/wikipedia/commons/0/03/Flag_of_Washington%2C_D.C.svg";
    }
    return flagId.startsWith("us-")
      ? `https://flagcdn.com/${flagId}.svg`
      : `/node_modules/circle-flags/flags/${flagId}.svg`;
  }

  function renderFlagImg(flagId) {
    const url = getFlagUrl(flagId);
    if (!url) return "";
    return `<img src="${url}" style="height: 1em; width: 1em; object-fit: cover; border-radius: 50%; position: relative; top: -2px; vertical-align: bottom; margin-left: 4px;">`;
  }

  function getPointCoords(feature, clickLngLat) {
    const coords = feature.geometry.coordinates.slice();
    while (Math.abs(clickLngLat.lng - coords[0]) > 180) {
      coords[0] += clickLngLat.lng > coords[0] ? 360 : -360;
    }
    return coords;
  }

  function addFlagPinLayers(baseId, source, colorExpr, filter = null) {
    const filterProp = filter ? { filter } : {};

    map.addLayer({
      id: baseId,
      type: "circle",
      source,
      ...filterProp,
      paint: {
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 5, 12, 15],
        "circle-color": colorExpr,
        "circle-stroke-color": "white",
        "circle-stroke-width": 1.25,
      },
    });

    map.addLayer({
      id: `${baseId}-flags`,
      type: "symbol",
      source,
      ...filterProp,
      layout: {
        "icon-image": [
          "case",
          ["has", "flagId"],
          ["concat", "flag-circle-", ["get", "flagId"]],
          "",
        ],
        "icon-size": ["interpolate", ["linear"], ["zoom"], 10, 0.3, 12, 0.9],
        "icon-allow-overlap": true,
        "icon-ignore-placement": true,
      },
    });
  }

  // --- Data Loaders ---
  async function loadFlightRoutesFromCSV(url) {
    try {
      const response = await fetch(url);
      const csvText = await response.text();
      const routes = [];
      const lines = csvText.trim().split("\n");
      const header = lines[0].split(",");

      const fromIndex = header.indexOf("From");
      const toIndex = header.indexOf("To");
      const canceledIndex = header.indexOf("Canceled");
      const dateIndex = header.indexOf("Date");

      for (let i = 1; i < lines.length; i++) {
        const columns = lines[i].split(",");
        if (
          columns.length >
          Math.max(fromIndex, toIndex, canceledIndex, dateIndex)
        ) {
          const from = columns[fromIndex]?.trim();
          const to = columns[toIndex]?.trim();
          const isCanceled = columns[canceledIndex] === "true";
          const date = columns[dateIndex]?.trim();

          if (from && to && !isCanceled) {
            routes.push({ origin: from, destination: to, date });
          }
        }
      }
      return routes;
    } catch (error) {
      console.error("Error loading flight data:", error);
      return [];
    }
  }

  async function getAirportDatabase() {
    const response = await fetch("/airports.json");
    const airports = await response.json();
    return new Map(airports.map((airport) => [airport.iata_code, airport]));
  }

  function createRouteFeatures(routes, db) {
    const features = [];
    for (const route of routes) {
      const originData = db.get(route.origin);
      const destData = db.get(route.destination);
      if (!originData || !destData) continue;

      const originCoords = [originData.longitude_deg, originData.latitude_deg];
      let destLng = destData.longitude_deg;

      const diff = destLng - originCoords[0];
      if (diff > 180) destLng -= 360;
      else if (diff < -180) destLng += 360;

      features.push({
        type: "Feature",
        geometry: {
          type: "LineString",
          coordinates: [originCoords, [destLng, destData.latitude_deg]],
        },
        properties: {
          origin: route.origin,
          destination: route.destination,
          count: route.count,
          hasPast: route.hasPast || false,
          pastCount: route.pastCount || 0,
          futureCount: route.futureCount || 0,
          totalCount: route.totalCount || route.count,
        },
      });
    }
    return features;
  }

  function createAirportFeatures(airportStatsMap, db) {
    const features = [];
    for (const [code, stats] of airportStatsMap.entries()) {
      const airportData = db.get(code);
      if (!airportData) continue;

      let flagId = null;
      if (airportData.iso_country) {
        flagId =
          airportData.iso_country === "US" && airportData.iso_region
            ? airportData.iso_region.toLowerCase()
            : airportData.iso_country.toLowerCase();
      }

      features.push({
        type: "Feature",
        geometry: {
          type: "Point",
          coordinates: [airportData.longitude_deg, airportData.latitude_deg],
        },
        properties: {
          code,
          name: airportData.name,
          country: airportData.iso_country,
          flagId,
          count: stats.count,
          status: stats.hasPast ? "completed" : "future",
        },
      });
    }
    return features;
  }

  map.on("load", async function () {
    const [
      airportDb,
      flightRoutes,
      cruisesGeoJSON,
      ferriesGeoJSON,
      stationsGeoJSON,
    ] = await Promise.all([
      getAirportDatabase(),
      loadFlightRoutesFromCSV("/flights.csv"),
      fetch("/cruises.geojson").then((r) => r.json()),
      fetch("/ferries.geojson").then((r) => r.json()),
      fetch("/stations.geojson").then((r) => r.json()),
    ]);

    // --- 1. Process Cruise Data (Single Source, Live Past/Future Status) ---
    const portStats = new Map();
    const cruiseRouteStats = new Map();

    cruisesGeoJSON.features.forEach((f) => {
      const isFuture = f.properties.date >= todayISO;

      if (f.geometry.type === "Point") {
        const key = f.properties.port;
        if (!portStats.has(key)) {
          portStats.set(key, {
            geometry: f.geometry,
            properties: {
              port: f.properties.port,
              state: f.properties.state,
              country: f.properties.country,
              flagId: f.properties.flagId,
            },
            count: 0,
            hasPast: false,
          });
        }
        const stats = portStats.get(key);
        stats.count++;
        if (!isFuture) stats.hasPast = true;
      } else if (f.geometry.type === "LineString") {
        const key = [f.properties.origin_port, f.properties.destination_port]
          .sort()
          .join("|");
        if (!cruiseRouteStats.has(key)) {
          cruiseRouteStats.set(key, {
            geometry: f.geometry,
            properties: {
              origin_port: f.properties.origin_port,
              destination_port: f.properties.destination_port,
            },
            pastCount: 0,
            futureCount: 0,
          });
        }
        const stats = cruiseRouteStats.get(key);
        if (isFuture) stats.futureCount++;
        else stats.pastCount++;
      }
    });

    const cruiseFeatures = [
      ...Array.from(portStats.values()).map((stats) => ({
        type: "Feature",
        geometry: stats.geometry,
        properties: {
          ...stats.properties,
          count: stats.count,
          status: stats.hasPast ? "completed" : "future",
        },
      })),
      ...Array.from(cruiseRouteStats.values()).map((stats) => ({
        type: "Feature",
        geometry: stats.geometry,
        properties: {
          ...stats.properties,
          pastCount: stats.pastCount,
          futureCount: stats.futureCount,
          count: stats.pastCount + stats.futureCount,
          status:
            stats.pastCount > 0 && stats.futureCount > 0
              ? "both"
              : stats.futureCount > 0
                ? "future"
                : "completed",
        },
      })),
    ];

    // --- 2. Process Flight Data ---
    const routeStatsPast = new Map();
    const routeStatsFuture = new Map();
    const airportStats = new Map();

    flightRoutes.forEach((route) => {
      const routeKey = [route.origin, route.destination].sort().join("-");
      const isFuture = route.date >= todayISO;

      const targetStats = isFuture ? routeStatsFuture : routeStatsPast;
      if (!targetStats.has(routeKey)) {
        targetStats.set(routeKey, {
          origin: route.origin,
          destination: route.destination,
          count: 0,
        });
      }
      targetStats.get(routeKey).count++;

      [route.origin, route.destination].forEach((code) => {
        if (!airportStats.has(code)) {
          airportStats.set(code, { count: 0, hasPast: false });
        }
        const stats = airportStats.get(code);
        stats.count++;
        if (!isFuture) stats.hasPast = true;
      });
    });

    for (const stats of routeStatsPast.values()) {
      stats.totalCount = stats.count;
    }

    for (const [routeKey, stats] of routeStatsFuture.entries()) {
      stats.totalCount = stats.count;
      if (routeStatsPast.has(routeKey)) {
        stats.hasPast = true;
        stats.pastCount = routeStatsPast.get(routeKey).count;
        routeStatsPast.get(routeKey).futureCount = stats.count;

        const combinedCount = stats.count + stats.pastCount;
        stats.totalCount = combinedCount;
        routeStatsPast.get(routeKey).totalCount = combinedCount;
      }
    }

    const pastFeatures = createRouteFeatures(
      Array.from(routeStatsPast.values()),
      airportDb,
    );
    const futureFeatures = createRouteFeatures(
      Array.from(routeStatsFuture.values()),
      airportDb,
    );
    const airportFeatures = createAirportFeatures(airportStats, airportDb);

    // --- 3. Preload Unique Circular Flag Assets ---
    const uniqueFlags = new Set();
    [
      ...cruiseFeatures,
      ...airportFeatures,
      ...stationsGeoJSON.features,
      ...ferriesGeoJSON.features,
    ].forEach((f) => {
      if (f.geometry?.type === "Point" && f.properties?.flagId) {
        uniqueFlags.add(f.properties.flagId);
      }
    });

    await Promise.all(
      Array.from(uniqueFlags).map(
        (flagId) =>
          new Promise((resolve) => {
            const imgUrl = getFlagUrl(flagId);
            if (!imgUrl) return resolve();

            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
              if (!map.hasImage("flag-circle-" + flagId)) {
                const scaleFactor = 4;
                const size = 32 * scaleFactor;
                const radius = 16 * scaleFactor;

                const canvas = document.createElement("canvas");
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext("2d");

                ctx.save();
                ctx.beginPath();
                ctx.arc(size / 2, size / 2, radius, 0, Math.PI * 2);
                ctx.clip();

                const scale = Math.max(size / img.width, size / img.height);
                const scaledWidth = img.width * scale;
                const scaledHeight = img.height * scale;
                ctx.drawImage(
                  img,
                  (size - scaledWidth) / 2,
                  (size - scaledHeight) / 2,
                  scaledWidth,
                  scaledHeight,
                );
                ctx.restore();

                map.addImage(
                  "flag-circle-" + flagId,
                  ctx.getImageData(0, 0, size, size),
                  { pixelRatio: scaleFactor },
                );
              }
              resolve();
            };
            img.onerror = () => resolve();
            img.src = imgUrl;
          }),
      ),
    );

    // --- 4. Add Sources and Layers ---

    // Places
    map.addSource("places", {
      type: "geojson",
      data: "https://api.{{ site.hostname }}/places.geojson",
    });

    map.addLayer({
      id: "places-dots",
      type: "circle",
      source: "places",
      maxzoom: 12,
      paint: {
        "circle-radius": 2.5,
        "circle-color": "#44d262",
        "circle-stroke-color": "white",
        "circle-stroke-width": 0.3125,
      },
    });

    map.addLayer({
      id: "places-icons",
      type: "symbol",
      source: "places",
      minzoom: 10,
      layout: {
        "icon-image": ["get", "icon"],
        "icon-size": [
          "interpolate",
          ["linear"],
          ["zoom"],
          10,
          0.08,
          11,
          0.25,
          12,
          0.5,
        ],
        "icon-allow-overlap": true,
        "icon-ignore-placement": true,
      },
    });

    // Rail (4px solid base + 2px dark dashed ties)
    map.addSource("rail-data", {
      type: "geojson",
      data: "/rail.geojson",
    });

    map.addLayer({
      id: "rail-lines-base",
      type: "line",
      source: "rail-data",
      paint: {
        "line-color": STATUS_COLOR,
        "line-width": 4,
        "line-opacity": 0.9,
      },
    });

    map.addLayer({
      id: "rail-lines-ties",
      type: "line",
      source: "rail-data",
      paint: {
        "line-color": "#212529",
        "line-dasharray": [2, 2],
        "line-width": 2,
        "line-opacity": 0.9,
      },
    });

    map.addSource("rail-stations-data", {
      type: "geojson",
      data: stationsGeoJSON,
    });

    addFlagPinLayers("rail-stations", "rail-stations-data", STATUS_COLOR, [
      "==",
      ["geometry-type"],
      "Point",
    ]);

    // Cruises (4px translucent wake + 2px beaded dots)
    map.addSource("cruise-data", {
      type: "geojson",
      data: { type: "FeatureCollection", features: cruiseFeatures },
    });

    map.addLayer({
      id: "cruise-wake",
      type: "line",
      source: "cruise-data",
      filter: ["==", ["geometry-type"], "LineString"],
      layout: WATER_LINE_LAYOUT,
      paint: {
        "line-color": STATUS_COLOR,
        "line-width": 4,
        "line-opacity": 0.05,
      },
    });

    map.addLayer({
      id: "cruise-route-lines",
      type: "line",
      source: "cruise-data",
      filter: ["==", ["geometry-type"], "LineString"],
      layout: WATER_LINE_LAYOUT,
      paint: {
        "line-color": STATUS_COLOR,
        "line-width": 2,
        "line-opacity": 1,
        "line-dasharray": [0.1, 2.2],
      },
    });

    // Alternating gold dots over silver on repeated past + future legs
    map.addLayer({
      id: "cruise-route-lines-overlap",
      type: "line",
      source: "cruise-data",
      filter: [
        "all",
        ["==", ["geometry-type"], "LineString"],
        ["==", ["get", "status"], "both"],
      ],
      layout: WATER_LINE_LAYOUT,
      paint: {
        "line-color": "#ffd700",
        "line-width": 2,
        "line-opacity": 1,
        "line-dasharray": [0.1, 4.5],
      },
    });

    addFlagPinLayers("cruise-ports", "cruise-data", STATUS_COLOR, [
      "==",
      ["geometry-type"],
      "Point",
    ]);

    // Ferries (4px translucent wake + 2px beaded dots)
    map.addSource("ferries-data", {
      type: "geojson",
      data: ferriesGeoJSON,
    });

    map.addLayer({
      id: "ferry-wake",
      type: "line",
      source: "ferries-data",
      filter: ["==", ["geometry-type"], "LineString"],
      layout: WATER_LINE_LAYOUT,
      paint: {
        "line-color": STATUS_COLOR,
        "line-width": 4,
        "line-opacity": 0.05,
      },
    });

    map.addLayer({
      id: "ferry-route-lines",
      type: "line",
      source: "ferries-data",
      filter: ["==", ["geometry-type"], "LineString"],
      layout: WATER_LINE_LAYOUT,
      paint: {
        "line-color": STATUS_COLOR,
        "line-width": 2,
        "line-opacity": 1,
        "line-dasharray": [0.1, 2.2],
      },
    });

    addFlagPinLayers("ferry-terminals", "ferries-data", STATUS_COLOR, [
      "==",
      ["geometry-type"],
      "Point",
    ]);

    // Flights (count-scaled solid lines)
    map.addSource("flight-routes-past", {
      type: "geojson",
      data: { type: "FeatureCollection", features: pastFeatures },
    });

    map.addSource("flight-routes-future", {
      type: "geojson",
      data: { type: "FeatureCollection", features: futureFeatures },
    });

    map.addSource("airport-nodes", {
      type: "geojson",
      data: { type: "FeatureCollection", features: airportFeatures },
    });

    const FLIGHT_WIDTH = [
      "interpolate",
      ["linear"],
      ["get", "totalCount"],
      1,
      2,
      10,
      10,
    ];

    map.addLayer({
      id: "route-lines-past",
      type: "line",
      source: "flight-routes-past",
      paint: {
        "line-color": "#c0c0c0",
        "line-opacity": 1,
        "line-width": FLIGHT_WIDTH,
      },
    });

    map.addLayer({
      id: "route-lines-future-solid",
      type: "line",
      source: "flight-routes-future",
      filter: ["!", ["get", "hasPast"]],
      paint: {
        "line-color": "#ffd700",
        "line-opacity": 1,
        "line-width": FLIGHT_WIDTH,
      },
    });

    map.addLayer({
      id: "route-lines-future-dashed",
      type: "line",
      source: "flight-routes-future",
      filter: ["get", "hasPast"],
      paint: {
        "line-color": "#ffd700",
        "line-opacity": 1,
        "line-dasharray": [10, 10],
        "line-width": FLIGHT_WIDTH,
      },
    });

    addFlagPinLayers("airport-points", "airport-nodes", STATUS_COLOR);
  });

  // --- Interactive Popups & Cursor ---
  const interactiveLayers = [
    "places-dots",
    "places-icons",
    "airport-points",
    "airport-points-flags",
    "route-lines-past",
    "route-lines-future-solid",
    "route-lines-future-dashed",
    "cruise-wake",
    "cruise-route-lines",
    "cruise-route-lines-overlap",
    "cruise-ports",
    "cruise-ports-flags",
    "ferry-wake",
    "ferry-route-lines",
    "ferry-terminals",
    "ferry-terminals-flags",
    "rail-lines-base",
    "rail-stations",
    "rail-stations-flags",
  ];

  map.on("click", interactiveLayers, function (e) {
    const feature = e.features[0];
    const layerId = feature.layer.id;
    const props = feature.properties;
    let html = "";
    let coordinates = e.lngLat;

    if (layerId === "places-dots" || layerId === "places-icons") {
      coordinates = getPointCoords(feature, e.lngLat);
      html = '<div class="text-center" style="color: #000;">';
      html += '<h6 class="mb-1">' + props.name + "</h6>";
      if (props.address && props.name != props.address) {
        html +=
          '<p class="mb-1" style="line-height: 1.25em;">' +
          JSON.parse(props.address).join("<br>") +
          "</p>";
      }
      if (props.id) {
        html +=
          ' <a href="https://foursquare.com/v/' +
          props.id +
          '" class="rounded-circle" style="width: 40px; height: 40px; padding-top: 10px; display:inline-block; vertical-align:top; text-align:center; background-color: #ffa633;"><img src="/node_modules/simple-icons/icons/swarm.svg" style="filter: invert(1); width: 20px; height: 20px; vertical-align: top;"></a>';
      }
      html +=
        ' <a href="https://maps.apple.com/?sll=' +
        coordinates[1] +
        "," +
        coordinates[0] +
        "&q=" +
        props.name +
        '" class="rounded-circle" style="width: 40px; height: 40px; padding-top: 10px; display:inline-block; vertical-align:top; text-align:center; background-color: #999999;"><img src="/node_modules/simple-icons/icons/apple.svg" style="filter: invert(1); width: 20px; height: 20px; vertical-align: top;"></a> ';
      html +=
        ' <a href="https://www.google.com/maps/search/?api=1&query=' +
        coordinates[1] +
        "," +
        coordinates[0] +
        '" class="rounded-circle" style="width: 40px; height: 40px; padding-top: 10px; display:inline-block; vertical-align:top; text-align:center; background-color: #4285f4;"><img src="/node_modules/simple-icons/icons/googlemaps.svg" style="filter: invert(1); width: 20px; height: 20px; vertical-align: top;"></a> ';
      html += "</div>";
    } else if (
      layerId === "airport-points" ||
      layerId === "airport-points-flags"
    ) {
      coordinates = getPointCoords(feature, e.lngLat);
      html = `
        <div class="text-center" style="color: #000;">
          <h6 class="mb-0">${props.name} ${renderFlagImg(props.flagId)}</h6>
          <p class="m-0">${props.count} ${props.count === 1 ? "visit" : "visits"}</p>
        </div>`;
    } else if (layerId.startsWith("route-lines")) {
      const pastCount = layerId.includes("future")
        ? props.pastCount || 0
        : props.count;
      const futureCount = layerId.includes("future")
        ? props.count
        : props.futureCount || 0;

      const textParts = [];
      if (pastCount > 0) {
        textParts.push(
          `${pastCount} past ${pastCount === 1 ? "flight" : "flights"}`,
        );
      }
      if (futureCount > 0) {
        textParts.push(
          `${futureCount} upcoming ${futureCount === 1 ? "flight" : "flights"}`,
        );
      }

      html = `
        <div class="text-center" style="color: #000;">
          <h6 class="mb-0">${props.origin} ↔ ${props.destination}</h6>
          <p class="m-0">${textParts.join("<br>")}</p>
        </div>`;
    } else if (layerId.startsWith("cruise-ports")) {
      coordinates = getPointCoords(feature, e.lngLat);
      html = `
        <div class="text-center" style="color: #000;">
          <h6 class="mb-0">${props.port} ${renderFlagImg(props.flagId)}</h6>
          <p class="m-0">${props.count} ${props.count === 1 ? "visit" : "visits"}</p>
        </div>`;
    } else if (
      layerId.startsWith("cruise-route-lines") ||
      layerId === "cruise-wake"
    ) {
      const textParts = [];
      if (props.pastCount > 0) {
        textParts.push(
          `${props.pastCount} past ${props.pastCount === 1 ? "voyage" : "voyages"}`,
        );
      }
      if (props.futureCount > 0) {
        textParts.push(
          `${props.futureCount} upcoming ${props.futureCount === 1 ? "voyage" : "voyages"}`,
        );
      }

      html = `
        <div class="text-center" style="color: #000;">
          <h6 class="mb-0">${props.origin_port} ↔ ${props.destination_port}</h6>
          <p class="m-0">${textParts.join("<br>")}</p>
        </div>`;
    } else if (layerId === "rail-lines-base") {
      html = `
        <div class="text-center" style="color: #000;">
          <h6 class="mb-0">${props.operator || "Rail"}</h6>
          <p class="m-0">${props.route || "Unknown Route"}</p>
        </div>`;
    } else if (
      layerId === "rail-stations" ||
      layerId === "rail-stations-flags"
    ) {
      coordinates = getPointCoords(feature, e.lngLat);
      html = `
        <div class="text-center" style="color: #000;">
          <h6 class="mb-0">${props.name || "Unknown Station"} ${renderFlagImg(props.flagId)}</h6>
          ${props.code ? `<p class="m-0 text-muted" style="font-size: 0.85em;">${props.code}</p>` : ""}
        </div>`;
    } else if (layerId === "ferry-route-lines" || layerId === "ferry-wake") {
      html = `
        <div class="text-center" style="color: #000;">
          <h6 class="mb-0">${props.operator || "Ferry"}</h6>
          <p class="m-0">${props.route || "Unknown Route"}</p>
        </div>`;
    } else if (
      layerId === "ferry-terminals" ||
      layerId === "ferry-terminals-flags"
    ) {
      coordinates = getPointCoords(feature, e.lngLat);
      html = `
        <div class="text-center" style="color: #000;">
          <h6 class="mb-0">${props.name || "Ferry Terminal"} ${renderFlagImg(props.flagId)}</h6>
        </div>`;
    }

    const popup = new mapboxgl.Popup({ closeButton: false })
      .setLngLat(coordinates)
      .setHTML(html)
      .addTo(map);

    if (typeof twemoji !== "undefined") {
      twemoji.parse(popup.getElement());
    }
  });

  map.on("mouseenter", interactiveLayers, function () {
    map.getCanvas().style.cursor = "pointer";
  });

  map.on("mouseleave", interactiveLayers, function () {
    map.getCanvas().style.cursor = "";
  });

  // --- Layer & Projection Toggles ---
  const TOGGLE_GROUPS = {
    "toggle-places": ["places-dots", "places-icons"],
    "toggle-flights": [
      "route-lines-past",
      "route-lines-future-solid",
      "route-lines-future-dashed",
      "airport-points",
      "airport-points-flags",
    ],
    "toggle-cruises": [
      "cruise-wake",
      "cruise-route-lines",
      "cruise-route-lines-overlap",
      "cruise-ports",
      "cruise-ports-flags",
      "ferry-wake",
      "ferry-route-lines",
      "ferry-terminals",
      "ferry-terminals-flags",
    ],
    "toggle-trains": [
      "rail-lines-base",
      "rail-lines-ties",
      "rail-stations",
      "rail-stations-flags",
    ],
  };

  Object.entries(TOGGLE_GROUPS).forEach(([id, layers]) => {
    document.getElementById(id).addEventListener("change", (e) => {
      const visibility = e.target.checked ? "visible" : "none";
      layers.forEach((layer) => {
        if (map.getLayer(layer)) {
          map.setLayoutProperty(layer, "visibility", visibility);
        }
      });
    });
  });

  document
    .getElementById("toggle-projection")
    .addEventListener("change", (e) => {
      map.setProjection(e.target.checked ? "globe" : "mercator");
    });
</script>
